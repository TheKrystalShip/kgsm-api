# kgsm-api — the site this node generates for the names its cluster's DNS anchor gave it.
#
# The API writes /var/lib/kgsm/nginx/kgsm-api.conf from a fixed template: a name, its certificate, and
# this component's proxy rules from /etc/nginx/kgsm/kgsm-api.locations. A name appears there only once
# its certificate exists. The pattern matches that one file and nothing else, and matching nothing is
# not an error, so the web server loads cleanly before the API has written anything.
include /var/lib/kgsm/nginx/kgsm-api*.conf;
