# kgsm-api — public vhost fragment, installed into /etc/nginx/conf.d/ by deploy/setup.sh.
#
# This leaf owns its own vhost and nothing else: the :80 ACME challenge block, the certificate
# lifecycle and nginx.conf itself are HOST-level, because a leaf that claimed them would make every
# other leaf on this box depend on it.
#
# The API terminates no TLS of its own — it listens on loopback only (Api__Urls). nginx holds the
# certificate, which is also why a renewal no longer restarts the service: nginx reloads instead.

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name kgsm.thekrystalship.com;

    ssl_certificate     /etc/letsencrypt/live/kgsm.thekrystalship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgsm.thekrystalship.com/privkey.pem;

    # nginx defaults to 1m. The file browser's PUT /servers/{id}/files carries whole game configs,
    # and a 413 there would look like a broken editor rather than a proxy limit.
    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:8097;
        proxy_http_version 1.1;

        # Host travels unchanged, so the app needs no X-Forwarded-Host to reconstruct it — one fewer
        # header it has to trust. The scheme and the client address DO have to be forwarded: without
        # them the app sees a plain-http request from loopback and writes its OAuth state cookie
        # without Secure, which keeps working and is exactly why it would go unnoticed.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        # SSE (/api/v1/stream, the assistant turn relay): stream frames through as they arrive. The
        # app already sends X-Accel-Buffering: no, which nginx honours; this makes it explicit rather
        # than dependent on a header staying in place upstream.
        proxy_buffering    off;
        proxy_cache        off;

        # A blueprint finalize relays for MINUTES behind heartbeats. The 60s default would cut it
        # mid-run and surface as a mysteriously failed save.
        proxy_read_timeout 3600s;
    }
}
